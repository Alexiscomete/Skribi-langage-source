[package]
name = "skribi"
version = "0.1.0"
edition = "2024"

[dependencies]
# Related to core features
chumsky = "0.13.0"
inkwell = { version = "0.9.0", features = ["llvm22-1"] }
logos = "0.16.1"
string-interner = "0.20.0"
# For a fancy output and simplified dev
clap = { version = "4.6.2", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.33"
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.19"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"
